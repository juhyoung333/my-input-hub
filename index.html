<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나만의 인풋 허브</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Quill Rich Text Editor CDN -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.js" crossorigin="anonymous"></script>
<!-- Google Fonts (Plus Jakarta Sans) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">

<style>
  :root {
    --bg-canvas: #f8fafc;
    --bg-card: #ffffff;
    --border-subtle: #e2e8f0;
    --text-primary: #0f172a;
    --text-muted: #64748b;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text-primary);
    background-color: var(--bg-canvas);
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* 파스텔 마스킹 테이프 뱃지 */
  .tape {
    display: inline-flex;
    align-items: center;
    padding: 2.5px 7.5px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: -0.01em;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .tape-mint    { background: #d1fae5; color: #065f46; border-color: #a7f3d0; border-left: 3.5px solid #10b981; }
  .tape-rose    { background: #ffe4e6; color: #9f1239; border-color: #fecdd3; border-left: 3.5px solid #f43f5e; }
  .tape-blue    { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; border-left: 3.5px solid #3b82f6; }
  .tape-amber   { background: #fef3c7; color: #92400e; border-color: #fde68a; border-left: 3.5px solid #f59e0b; }
  .tape-purple  { background: #ede9fe; color: #5b21b6; border-color: #ddd6fe; border-left: 3.5px solid #8b5cf6; }
  .tape-teal    { background: #ccfbf1; color: #115e59; border-color: #99f6e4; border-left: 3.5px solid #14b8a6; }
  .tape-indigo  { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; border-left: 3.5px solid #6366f1; }
  .tape-slate   { background: #f1f5f9; color: #334155; border-color: #e2e8f0; border-left: 3.5px solid #94a3b8; }
  .tape-highlight-mint { background: linear-gradient(180deg, transparent 56%, #d1fae5 56%); padding: 0 2px; }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

  /* Quill 커스텀 */
  .ql-toolbar.ql-snow {
    border: 1px solid var(--border-subtle) !important;
    border-bottom: none !important;
    border-radius: 12px 12px 0 0;
    background: #fbfcfe;
    padding: 8px 10px;
  }
  .ql-container.ql-snow {
    border: 1px solid var(--border-subtle) !important;
    border-radius: 0 0 12px 12px;
    background: #ffffff;
    font-family: inherit;
    font-size: 14px;
  }
  .ql-editor {
    min-height: 220px;
    line-height: 1.75;
    padding: 14px 16px;
    color: #1e293b;
  }
  @media (min-width: 768px) {
    .ql-editor { min-height: 320px; }
  }

  /* 반응형 모달 전환 */
  .modal-sheet {
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .sheet-normal { max-width: 820px; height: 90vh; }
  .sheet-full   { max-width: 96vw;  height: 94vh; }

  /* 카드 인터랙션 */
  .input-card {
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .input-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px -4px rgba(0, 0, 0, 0.05);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.97) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .animate-modal { animation: modalIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
</style>
</head>

<body class="flex h-screen bg-slate-50 antialiased overflow-hidden">

<!-- 모바일 사이드바 배경 오버레이 -->
<div id="sidebarBackdrop" class="fixed inset-0 bg-slate-900/40 z-30 hidden md:hidden backdrop-blur-xs transition-opacity"></div>

<!-- 좌측 네비게이션 사이드바 -->
<aside id="mainSidebar" class="fixed inset-y-0 left-0 z-40 w-72 md:w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 transform -translate-x-full md:translate-x-0 transition-transform duration-250 ease-out shadow-xl md:shadow-none md:static">
  <div class="flex flex-col flex-1 overflow-hidden">
    <!-- 브랜드 로고 & 모바일 닫기 버튼 -->
    <div class="p-4 md:p-5 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-slate-900 flex items-center justify-center text-white font-black text-xs tracking-wider shadow-xs">
          IH
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-800 tracking-tight">나만의 인풋 허브</h1>
          <p class="text-[10px] text-slate-400 font-medium">Simple Secret Sync</p>
        </div>
      </div>
      <button id="closeSidebarBtn" class="md:hidden p-1.5 text-slate-400 hover:text-slate-700 text-sm font-bold">
        ✕
      </button>
    </div>

    <!-- 네비게이션 목록 -->
    <nav class="flex-1 overflow-y-auto px-3 py-3 space-y-4">
      <!-- 1. 개요 & 리포트 -->
      <div>
        <div class="px-3 pb-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Overview</div>
        <div class="space-y-1">
          <button class="nav-btn w-full flex items-center justify-between px-3 py-2 text-xs font-semibold rounded-xl bg-slate-100 text-slate-900 font-bold transition-all" data-tab="home">
            <span class="flex items-center gap-2.5">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
              홈 대시보드
            </span>
          </button>
          <button class="nav-btn w-full flex items-center justify-between px-3 py-2 text-xs font-semibold rounded-xl hover:bg-slate-50 transition-all text-slate-600" data-tab="report">
            <span class="flex items-center gap-2.5">
              <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
              리포트 &amp; 통계
            </span>
          </button>
        </div>
      </div>

      <!-- 2. 동적 인풋 수집 서랍 -->
      <div>
        <div class="px-3 pb-1 flex items-center justify-between">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Input Collection</span>
          <button id="addCategoryBtn" class="text-[11px] font-bold text-emerald-600 hover:text-emerald-700 hover:bg-emerald-50 px-1.5 py-0.5 rounded transition-all">
            ＋ 새 서랍
          </button>
        </div>
        <div class="space-y-1" id="dynamicInputNavList"></div>
      </div>

      <!-- 3. 생각 & 구조화 시스템 -->
      <div>
        <div class="px-3 pb-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Thought Engine</div>
        <div class="space-y-1">
          <button class="nav-btn w-full flex items-center justify-between px-3 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-50 transition-all" data-tab="concept">
            <span class="flex items-center gap-2.5">
              <span class="w-2 h-2 rounded-sm bg-blue-500"></span>
              1층 · 개념 노트
            </span>
            <span class="text-xs px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 font-medium" id="count-concept">0</span>
          </button>
          <button class="nav-btn w-full flex items-center justify-between px-3 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-50 transition-all" data-tab="log">
            <span class="flex items-center gap-2.5">
              <span class="w-2 h-2 rounded-sm bg-amber-500"></span>
              2층 · 시황로그
            </span>
            <span class="text-xs px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 font-medium" id="count-log">0</span>
          </button>
          <button class="nav-btn w-full flex items-center justify-between px-3 py-2 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-50 transition-all" data-tab="idea">
            <span class="flex items-center gap-2.5">
              <span class="w-2 h-2 rounded-sm bg-purple-500"></span>
              3층 · 아이디어
            </span>
            <span class="text-xs px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 font-medium" id="count-idea">0</span>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <!-- 사이드바 하단: [예전 투두웹 방식] 비밀번호 동기화 박스 -->
  <div class="p-3 border-t border-slate-100 space-y-2 bg-slate-50/50">
    <div class="p-2.5 rounded-xl bg-white border border-slate-200">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[11px] font-bold text-slate-700 flex items-center gap-1">
          <span>🔑</span> 동기화 비밀번호
        </span>
        <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-emerald-500" title="연결됨"></span>
      </div>
      <p class="text-[10px] text-slate-400 mb-2 leading-relaxed">스마트폰과 노트북에 똑같은 암호를 입력하면 팝업 없이 즉시 이어집니다.</p>
      
      <div class="flex gap-1.5">
        <input id="syncPasswordInput" type="text" placeholder="예: my1234" class="w-full px-2 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-slate-400 font-mono text-slate-700">
        <button id="applySyncPasswordBtn" class="px-2.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold shrink-0 transition-all">
          연결
        </button>
      </div>
      <div class="text-[9px] text-slate-400 mt-1.5 flex items-center justify-between">
        <span>현재 서랍: <strong id="currentSyncLabel" class="text-slate-600 font-mono">기본금고</strong></span>
        <span id="syncStatusText" class="text-emerald-600 font-semibold">실시간 동기화중</span>
      </div>
    </div>

    <button id="quickCreateBtn" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white text-xs font-bold shadow-sm transition-all">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
      <span>새 인풋 작성</span>
    </button>
  </div>
</aside>

<!-- 메인 뷰포트 -->
<main class="flex-1 flex flex-col h-screen overflow-hidden">
  <!-- 상단 모바일/데스크톱 헤더 -->
  <header class="h-14 md:h-16 border-b border-slate-200 bg-white/95 backdrop-blur-sm px-4 md:px-8 flex items-center justify-between shrink-0 z-10">
    <div class="flex items-center gap-2.5">
      <!-- 모바일 햄버거 메뉴 버튼 -->
      <button id="openSidebarBtn" class="md:hidden p-2 -ml-1 text-slate-600 hover:text-slate-900 rounded-lg hover:bg-slate-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <h2 id="currentViewTitle" class="text-sm md:text-base font-bold text-slate-800 truncate">홈 대시보드</h2>
      <span id="currentViewBadge" class="tape tape-slate hidden text-[10px]">0건</span>
    </div>

    <!-- 헤더 우측 메뉴 -->
    <div class="flex items-center gap-1.5 md:gap-2">
      <!-- 검색창 -->
      <div class="relative w-32 sm:w-44 md:w-56">
        <input id="searchInput" type="text" placeholder="검색..." class="w-full pl-7 md:pl-8 pr-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-slate-400 focus:bg-white transition-all text-slate-700">
        <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2 md:left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>

      <button id="templateManageBtn" class="px-2.5 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 hidden sm:inline-flex">
        서식 틀
      </button>
      <button id="dataManageBtn" class="px-2.5 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 flex items-center gap-1">
        <span>💾</span>
        <span class="hidden sm:inline">백업</span>
      </button>
    </div>
  </header>

  <!-- 메인 스크롤 영역 -->
  <div id="contentScrollArea" class="flex-1 overflow-y-auto p-4 md:p-8 max-w-6xl w-full mx-auto select-text"></div>
</main>

<!-- 공통 노트 작성/조회 모달 -->
<div id="modalContainer" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-end md:items-center justify-center p-0 md:p-4 hidden">
  <div id="modalSheet" class="modal-sheet w-full bg-white rounded-t-2xl md:rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-modal h-[94vh] md:h-[88vh] max-w-3xl">
    <!-- 모달 상단 헤더 -->
    <div class="h-12 md:h-14 px-4 md:px-6 border-b border-slate-100 flex items-center justify-between shrink-0 bg-slate-50/80">
      <div class="flex items-center gap-2">
        <button id="modalCloseBtn" class="px-2 py-1 text-slate-500 hover:text-slate-800 text-xs font-bold rounded-lg hover:bg-slate-200/50 transition-all">✕ 닫기</button>
        <button id="toggleNotionWidthBtn" class="hidden md:flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all">
          <span id="widthToggleLabel">페이지 넓게</span>
        </button>
      </div>
      <div class="flex items-center gap-2" id="modalHeaderRight"></div>
    </div>
    <!-- 모달 본문 바디 -->
    <div id="modalBody" class="flex-1 overflow-y-auto p-4 md:p-6 select-text"></div>
  </div>
</div>

<!-- 새 목차 추가 모달 -->
<div id="categoryModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-2xl w-full max-w-md p-5 md:p-6 shadow-2xl border border-slate-200 animate-modal max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
      <h3 class="text-sm font-bold text-slate-800" id="catModalTitle">새 인풋 서랍 만들기</h3>
      <button id="closeCategoryModalBtn" class="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
    </div>

    <div class="space-y-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">서랍 이름 *</label>
        <input id="newCatNameInput" type="text" placeholder="예: 강의 메모, 팟캐스트, 부동산 임장" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-slate-400">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">빠른 속성 프리셋</label>
        <div class="grid grid-cols-2 gap-1.5">
          <button type="button" id="presetSimpleBtn" class="text-left p-2 border border-slate-200 rounded-xl text-[11px] text-slate-700 bg-slate-50">
            📄 <strong>단순 메모</strong><br><span class="text-slate-400 text-[10px]">제목 + 날짜</span>
          </button>
          <button type="button" id="presetLectureBtn" class="text-left p-2 border border-slate-200 rounded-xl text-[11px] text-slate-700 bg-slate-50">
            🎓 <strong>강의·세미나</strong><br><span class="text-slate-400 text-[10px]">강사/기관 포함</span>
          </button>
          <button type="button" id="presetWebBtn" class="text-left p-2 border border-slate-200 rounded-xl text-[11px] text-slate-700 bg-slate-50">
            🔗 <strong>웹 링크형</strong><br><span class="text-slate-400 text-[10px]">URL 링크 포함</span>
          </button>
          <button type="button" id="presetReviewBtn" class="text-left p-2 border border-slate-200 rounded-xl text-[11px] text-slate-700 bg-slate-50">
            ⭐ <strong>리뷰·평점형</strong><br><span class="text-slate-400 text-[10px]">별점 포함</span>
          </button>
        </div>
      </div>

      <div class="p-3 rounded-xl border border-slate-200 bg-slate-50/70 space-y-2 text-xs">
        <label class="flex items-center justify-between text-slate-700 cursor-pointer">
          <span>🔗 참조 링크 (URL 입력칸)</span>
          <input type="checkbox" id="fieldToggleUrl" class="w-4 h-4 rounded accent-slate-900">
        </label>
        <label class="flex items-center justify-between text-slate-700 cursor-pointer pt-1 border-t border-slate-200">
          <span>🏷️ 보조 항목 (강사, 출처 등)</span>
          <input type="checkbox" id="fieldToggleSub" class="w-4 h-4 rounded accent-slate-900">
        </label>
        <div id="subFieldNameArea" class="mt-1 hidden">
          <input id="subFieldLabelInput" type="text" placeholder="항목 이름 (예: 강사명, 출처)" class="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded-lg bg-white">
        </div>
        <label class="flex items-center justify-between text-slate-700 cursor-pointer pt-1 border-t border-slate-200">
          <span>⭐ 별점 / 한 줄 평가</span>
          <input type="checkbox" id="fieldToggleRating" class="w-4 h-4 rounded accent-slate-900">
        </label>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1.5">테마 색상</label>
        <div class="grid grid-cols-4 gap-1.5" id="catColorPickerGroup"></div>
      </div>

      <div class="pt-2 border-t border-slate-100 flex justify-end gap-2">
        <button id="cancelCategoryModalBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-500">취소</button>
        <button id="submitNewCategoryBtn" class="px-4 py-1.5 bg-slate-900 text-white rounded-xl text-xs font-bold">저장하기</button>
      </div>
    </div>
  </div>
</div>

<!-- 백업 & 복원 모달 -->
<div id="dataManageModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl border border-slate-200 animate-modal">
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
      <h3 class="text-sm font-bold text-slate-800">데이터 백업 및 복원</h3>
      <button id="closeDataModalBtn" class="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
    </div>

    <div class="space-y-3">
      <button id="exportJsonBtn" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
        <span>📥</span>
        <span>백업 파일 다운로드 (.json)</span>
      </button>

      <input type="file" id="importJsonFileInput" accept=".json" class="hidden">
      <button id="triggerImportBtn" class="w-full py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
        <span>📤</span>
        <span>백업 파일 불러오기 (복원)</span>
      </button>
    </div>
  </div>
</div>

<!-- 알림 토스트 UI -->
<div id="toastMessage" class="fixed bottom-5 right-5 px-3.5 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold shadow-xl transform transition-all duration-200 z-50 flex items-center gap-2 opacity-0 translate-y-10 pointer-events-none">
  <span class="w-2 h-2 rounded-full bg-emerald-400"></span>

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayDate() { return new Date().toISOString().slice(0, 10); }
function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : (s || ''); }
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function stripHtml(html) { return String(html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }

function showToast(message) {
  const toast = document.getElementById('toastMessage');
  if (!toast) return;
  toast.querySelector('#toastText').textContent = message;
  toast.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
  }, 2200);
}

async function initFirebase() {
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);

    // 저장되어 있던 비밀번호 불러오기 (없으면 기본값)
    try {
      const savedPw = localStorage.getItem('hub_sync_password');
      if (savedPw) syncPassword = savedPw.trim();
    } catch(e) {}

    const pwInput = document.getElementById('syncPasswordInput');
    const pwLabel = document.getElementById('currentSyncLabel');
    if (pwInput) pwInput.value = syncPassword;
    if (pwLabel) pwLabel.textContent = syncPassword;

    // 조용한 백그라운드 인증 (구글 팝업 없이 1회 토큰 획득)
    const userCred = await signInAnonymously(auth);
    currentAuthUser = userCred.user;

    // 비밀번호에 해당하는 서랍으로 즉시 실시간 연결
    connectToPasswordVault(syncPassword);

  } catch (err) {
    console.error('Firebase 초기화 오류:', err);
    loadFromLocal();
  }
}

// 비밀번호(동기화 키)로 Firestore 서랍 연결
function connectToPasswordVault(pw) {
  if (!db || !currentAuthUser) return;
  if (unsubscribeFirestore) unsubscribeFirestore();

  const cleanPw = (pw || 'main-vault').trim().replace(/[^a-zA-Z0-9_\-\.]/g, '_');
  syncPassword = cleanPw;

  try {
    localStorage.setItem('hub_sync_password', cleanPw);
  } catch(e) {}

  const pwLabel = document.getElementById('currentSyncLabel');
  if (pwLabel) pwLabel.textContent = cleanPw;

  const dot = document.getElementById('syncStatusDot');
  const txt = document.getElementById('syncStatusText');
  if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
  if (txt) { txt.textContent = '서랍 찾는 중...'; txt.className = 'text-amber-600 font-semibold'; }

  // Firestore 문서 참조 경로는 짝수 세그먼트 필수 (artifacts / appId / public / data / vaults / docId)
  const vaultDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'vaults', 'vault_' + cleanPw);

  unsubscribeFirestore = onSnapshot(vaultDocRef, (snap) => {
    if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
    if (txt) { txt.textContent = '실시간 동기화중'; txt.className = 'text-emerald-600 font-semibold'; }

    if (snap.exists()) {
      const data = snap.data();
      if (data) {
        if (data.categories) state.categories = data.categories;
        if (data.notes) state.notes = data.notes;
        if (data.bookGoals) state.bookGoals = data.bookGoals;
        if (data.bookWishlist) state.bookWishlist = data.bookWishlist;
        if (data.templates) state.templates = data.templates;

        updateSidebar();
        renderCurrentView();
      }
    } else {
      // 새 비밀번호 서랍일 경우 현재 기본 상태 저장
      saveAppStateToCloud();
    }
  }, (err) => {
    console.warn('동기화 오류:', err);
    if (dot) dot.className = 'w-2 h-2 rounded-full bg-rose-400';
    if (txt) { txt.textContent = '오프라인'; txt.className = 'text-rose-500 font-semibold'; }
  });
}

// 비밀번호 변경 버튼 클릭 시
document.getElementById('applySyncPasswordBtn')?.addEventListener('click', () => {
  const input = document.getElementById('syncPasswordInput');
  const newPw = input ? input.value.trim() : '';
  if (!newPw) {
    showToast('비밀번호를 입력해 주세요.');
    return;
  }
  connectToPasswordVault(newPw);
  showToast(`[${newPw}] 서랍으로 연결되었습니다!`);
});

async function saveAppStateToCloud() {
  try {
    localStorage.setItem('hub_cached_state', JSON.stringify(state));
  } catch (e) {}

  if (!db || !currentAuthUser) return;

  try {
    const cleanPw = (syncPassword || 'main-vault').trim().replace(/[^a-zA-Z0-9_\-\.]/g, '_');
    const vaultDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'vaults', 'vault_' + cleanPw);

    await setDoc(vaultDocRef, {
      ...state,
      lastUpdatedAt: new Date().toISOString()
    }, { merge: true });
  } catch (err) {
    console.error('클라우드 저장 실패:', err);
  }
}

function loadFromLocal() {
  try {
    const cached = localStorage.getItem('hub_cached_state');
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed.categories) state.categories = parsed.categories;
      if (parsed.notes) state.notes = parsed.notes;
      if (parsed.bookGoals) state.bookGoals = parsed.bookGoals;
      if (parsed.bookWishlist) state.bookWishlist = parsed.bookWishlist;
      if (parsed.templates) state.templates = parsed.templates;
    }
  } catch (e) {}
  updateSidebar();
  renderCurrentView();
}

function getCategory(typeId) {
  return state.categories.find(c => c.id === typeId) || {
    id: typeId,
    name: '기록',
    tapeClass: 'tape-slate',
    dotClass: 'bg-slate-400',
    desc: '아카이브',
    fixed: false,
    fields: { hasUrl: false, hasSub: false, subLabel: '', hasRating: false }
  };
}

function findNoteItem(typeId, noteId) {
  return (state.notes[typeId] || []).find(n => n.id === noteId);
}

function getNoteDisplayTitle(typeId, noteId) {
  const item = findNoteItem(typeId, noteId);
  if (!item) return '(삭제된 노트)';
  if (typeId === 'concept') return item.title || '(개념명 없음)';
  if (typeId === 'book') return item.title || '(도서명 없음)';
  if (typeId === 'article') return item.title || '(기사명 없음)';
  if (typeId === 'log') return (item.date || '') + ' 시황로그';
  if (typeId === 'idea') return item.question || '(질문 없음)';
  return item.title || '(기록)';
}

function getAllFlatNotes() {
  const list = [];
  state.categories.forEach(cat => {
    (state.notes[cat.id] || []).forEach(n => {
      list.push({
        type: cat.id,
        id: n.id,
        title: getNoteDisplayTitle(cat.id, n.id),
        date: n.updatedAt || n.date || n.readDate || n.scrapDate || todayDate(),
        bodyHtml: n.bodyHtml || ''
      });
    });
  });
  return list;
}

function renderCurrentView() {
  const container = document.getElementById('contentScrollArea');
  const viewTitle = document.getElementById('currentViewTitle');
  const badge = document.getElementById('currentViewBadge');

  if (currentTab === 'home') {
    viewTitle.textContent = '홈 대시보드';
    badge.classList.add('hidden');
    renderHomeDashboard(container);
  } else if (currentTab === 'report') {
    viewTitle.textContent = '리포트 & 통계';
    badge.classList.add('hidden');
    renderReportDashboard(container);
  } else if (currentTab === 'book') {
    const cat = getCategory('book');
    viewTitle.textContent = cat.name;
    badge.textContent = `${(state.notes.book || []).length}권 완독`;
    badge.className = `tape ${cat.tapeClass}`;
    badge.classList.remove('hidden');
    renderBookHubView(container);
  } else {
    const cat = getCategory(currentTab);
    const count = (state.notes[currentTab] || []).length;
    viewTitle.textContent = cat.name;
    badge.textContent = `${count}건`;
    badge.className = `tape ${cat.tapeClass}`;
    badge.classList.remove('hidden');
    renderCardListView(container, currentTab);
  }
}

function renderCardListView(container, typeId) {

        <h4 class="text-sm font-bold text-slate-800 mb-1">기록이 비어 있습니다</h4>
        <p class="text-xs text-slate-400 mb-5">첫 번째 노트를 작성해보세요.</p>
        <button id="cardEmptyCreateBtn" class="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl">
          ＋ 새 ${escapeHtml(cat.name)} 작성
        </button>
      </div>
    `;
    container.querySelector('#cardEmptyCreateBtn')?.addEventListener('click', () => openModal(typeId, null));
    return;
  }

  container.innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <div class="flex items-center gap-2">
        <p class="text-xs text-slate-400 font-medium">${escapeHtml(cat.desc || '')} (${items.length})</p>
        ${!cat.fixed ? `<button id="openPropSettingBtn" class="text-[11px] text-slate-400 hover:text-slate-700 underline">속성 ⚙️</button>` : ''}
      </div>
      <button id="cardTopCreateBtn" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl flex items-center gap-1">
        <span>＋</span> 새 글
      </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
      ${items.map(item => {
        let title = item.title || '(제목 없음)';
        let subMeta = '';
        let extraBadge = '';

        if (typeId === 'concept') {
          subMeta = item.hub ? `허브: ${item.hub}` : '미분류';
        } else if (typeId === 'article') {
          subMeta = item.scrapDate || '날짜 미상';
          if (item.url) extraBadge = `<span class="tape tape-slate text-[10px]">링크</span>`;
        } else if (typeId === 'log') {
          title = (item.date || '날짜 없음') + ' 시황로그';
          subMeta = item.question ? `질문: ${truncate(item.question, 18)}` : '시장 관찰';
        } else if (typeId === 'idea') {
          title = item.question || '(질문 없음)';
          subMeta = `신뢰도 ${item.confidence || 50}%`;
          const oc = item.outcome === '적중' ? 'tape-mint' : (item.outcome === '불일치' ? 'tape-rose' : 'tape-slate');
          extraBadge = `<span class="tape ${oc} text-[10px]">${escapeHtml(item.outcome || '대기중')}</span>`;
        } else {
          const parts = [];
          if (item.subVal) parts.push(item.subVal);
          parts.push(item.date || item.updatedAt || todayDate());
          subMeta = parts.join(' · ');
          if (item.rating) extraBadge = `<span class="tape tape-amber text-[10px]">⭐ ${escapeHtml(item.rating)}</span>`;
        }

        const snippet = stripHtml(item.bodyHtml || '');

        return `
          <div class="input-card bg-white border border-slate-200 rounded-2xl p-4 cursor-pointer flex flex-col justify-between" data-open-item="${item.id}" data-search="${escapeHtml(title + ' ' + snippet + ' ' + subMeta)}">

  container.querySelector('#cardTopCreateBtn')?.addEventListener('click', () => openModal(typeId, null));

  container.querySelectorAll('[data-open-item]').forEach(el => {
    el.onclick = () => openModal(typeId, el.dataset.openItem);
  });
}

function bindEditEvents(top) {
  const { type, id } = top;
  const isNew = !id;
  const data = isNew ? {} : (findNoteItem(type, id) || {});

  document.getElementById('field_confidence')?.addEventListener('input', (e) => {
    const val = document.getElementById('confVal');
    if (val) val.textContent = e.target.value + '%';
  });

  quillEditor = new Quill('#quillEditorRoot', {
    theme: 'snow',
    placeholder: '인사이트와 요약을 기록하세요...',
    modules: {
      toolbar: [
        [{ header: [2, 3, false] }],
        ['bold', 'italic', 'underline', 'blockquote'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link', 'clean']
      ]
    }
  });

  if (data.bodyHtml) {
    quillEditor.root.innerHTML = data.bodyHtml;
  } else if (top.initialTemplateHtml) {
    quillEditor.root.innerHTML = top.initialTemplateHtml;
  }

  document.getElementById('applyTemplateFastBtn')?.addEventListener('click', () => {
    openTemplateChooser(type);
  });

  renderSelectedChips();

  const relInput = document.getElementById('relationSearchInput');
  const relResults = document.getElementById('relationSearchResults');

  relInput?.addEventListener('input', () => {
    const q = relInput.value.trim().toLowerCase();
    if (!q) {
      relResults.classList.add('hidden');
      return;
    }
    const matches = getAllFlatNotes()
      .filter(n => !(n.type === type && n.id === id))
      .filter(n => n.title.toLowerCase().includes(q))
      .filter(n => !tempRelated.includes(`${n.type}:${n.id}`))
      .slice(0, 5);

    if (matches.length === 0) {
      relResults.innerHTML = '<div class="p-2 text-xs text-slate-400 text-center">검색 결과 없음</div>';
    } else {
      relResults.innerHTML = matches.map(m => `
        <div class="p-2 hover:bg-slate-50 flex items-center justify-between cursor-pointer" data-add-rel="${m.type}:${m.id}">
          <span class="text-xs font-semibold text-slate-700 truncate pr-2">${escapeHtml(m.title)}</span>
          <span class="tape ${getCategory(m.type).tapeClass} text-[10px]">${escapeHtml(getCategory(m.type).name)}</span>
        </div>
      `).join('');
    }
    relResults.classList.remove('hidden');

    relResults.querySelectorAll('[data-add-rel]').forEach(btn => {
      btn.addEventListener('click', () => {
        tempRelated.push(btn.dataset.addRel);
        relInput.value = '';
        relResults.classList.add('hidden');
        renderSelectedChips();
      });
    });
  });

  document.getElementById('modalSaveBtn')?.addEventListener('click', async () => {
    let item = isNew ? { id: uid() } : findNoteItem(type, id);

    if (type === 'concept') {
      item.title = document.getElementById('field_title').value.trim() || '개념';
      item.hub = document.getElementById('field_hub').value.trim();
    } else if (type === 'book') {
      item.title = document.getElementById('field_title').value.trim() || '도서';
      item.author = document.getElementById('field_author').value.trim();
      item.rating = document.getElementById('field_rating').value.trim();
      item.readDate = document.getElementById('field_readDate').value;
    } else if (type === 'article') {
      item.title = document.getElementById('field_title').value.trim() || '기사';
      item.scrapDate = document.getElementById('field_scrapDate').value;
      item.url = document.getElementById('field_url').value.trim();
    } else if (type === 'log') {
      item.date = document.getElementById('field_date').value || todayDate();
    } else if (type === 'idea') {
      item.question = document.getElementById('field_question').value.trim() || '가설';
      item.confidence = parseInt(document.getElementById('field_confidence').value, 10);
      item.reviewDate = document.getElementById('field_reviewDate').value;
      item.outcome = document.getElementById('field_outcome').value;
    } else {
      item.title = document.getElementById('field_title').value.trim() || '기록';
      item.date = document.getElementById('field_date')?.value || todayDate();
      item.url = document.getElementById('field_url')?.value.trim() || '';
      item.subVal = document.getElementById('field_subVal')?.value.trim() || '';
      item.rating = document.getElementById('field_rating')?.value.trim() || '';
    }

    if (type !== 'idea') {
      item.question = document.getElementById('field_question')?.value.trim() || '';
    }

    item.bodyHtml = quillEditor ? quillEditor.root.innerHTML : '';
    if (item.bodyHtml === '<p><br></p>') item.bodyHtml = '';
    item.related = [...tempRelated];
    item.updatedAt = todayDate();

    if (isNew) {
      if (!state.notes[type]) state.notes[type] = [];
      state.notes[type].push(item);
    }

    await saveAppStateToCloud();
    showToast('저장 완료!');

    top.id = item.id;
    top.mode = 'view';
    renderModalUI();
  });
}

function renderSelectedChips() {
  const container = document.getElementById('selectedChipsContainer');
  if (!container) return;

  if (tempRelated.length === 0) {
    container.innerHTML = '<span class="text-xs text-slate-400 italic">연결된 노트 없음</span>';
    return;
  }

  container.innerHTML = tempRelated.map(rel => {
    const [t, i] = rel.split(':');
    return `
      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs bg-slate-100 text-slate-700">
        <span>${escapeHtml(getNoteDisplayTitle(t, i))}</span>

function openModal(type, id, initialTemplateHtml = '') {
  modalStack.push({ type, id, mode: id ? 'view' : 'edit', initialTemplateHtml });
  renderModalUI();
}

function closeModal() {
  modalStack.pop();
  if (modalStack.length > 0) {
    renderModalUI();
  } else {
    document.getElementById('modalContainer')?.classList.add('hidden');
    quillEditor = null;
    updateSidebar();
    renderCurrentView();
  }
}

function renderModalUI() {
  const container = document.getElementById('modalContainer');
  if (!container) return;
  if (modalStack.length === 0) {
    container.classList.add('hidden');
    return;
  }
  container.classList.remove('hidden');

  const top = modalStack[modalStack.length - 1];
  const sheet = document.getElementById('modalSheet');
  const widthLabel = document.getElementById('widthToggleLabel');
  if (sheet) {
    sheet.className = `modal-sheet w-full bg-white rounded-t-2xl md:rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-modal ${isNotionFullWidth ? 'sheet-full' : 'sheet-normal'}`;
  }
  if (widthLabel) widthLabel.textContent = isNotionFullWidth ? '표준 폭' : '넓게';

  const headerRight = document.getElementById('modalHeaderRight');
  if (headerRight) {
    if (top.mode === 'view') {
      headerRight.innerHTML = `
        <button id="modalDeleteBtn" class="px-2.5 py-1 text-rose-600 hover:bg-rose-50 text-xs font-bold rounded-lg">삭제</button>
        <button id="modalEditBtn" class="px-3 py-1 bg-slate-900 text-white text-xs font-bold rounded-lg shadow-xs">편집</button>
      `;
      document.getElementById('modalEditBtn')?.addEventListener('click', () => {
        top.mode = 'edit';
        renderModalUI();
      });
      document.getElementById('modalDeleteBtn')?.addEventListener('click', async () => {
        state.notes[top.type] = (state.notes[top.type] || []).filter(item => item.id !== top.id);
        await saveAppStateToCloud();
        showToast('삭제되었습니다.');
        closeModal();
      });
    } else {
      headerRight.innerHTML = `
        <button id="modalSaveBtn" class="px-3.5 py-1 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg shadow-xs">저장</button>
      `;
    }
  }

  const bodyEl = document.getElementById('modalBody');
  if (top.mode === 'view') {
    bodyEl.innerHTML = viewHtml(top.type, top.id);
    bodyEl.querySelectorAll('[data-jump-note]').forEach(btn => {
      btn.onclick = () => {
        const [rt, rid] = btn.dataset.jumpNote.split(':');
        openModal(rt, rid);
      };
    });
  } else {
    bodyEl.innerHTML = renderEditHtml(top.type, top.id);
    bindEditEvents(top);
  }
}

function switchTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.remove('bg-slate-100', 'text-slate-900', 'font-bold');
    btn.classList.add('text-slate-600');
    if (btn.dataset.tab === tabId) {
      btn.classList.remove('text-slate-600');
      btn.classList.add('bg-slate-100', 'text-slate-900', 'font-bold');
    }
  });
  renderCurrentView();
}

          <span class="tape tape-mint text-[10px] mb-1">${currentSelectedBookYear}년 독서 목표</span>

            완독 <span class="tape-highlight-mint font-black">${completedInYear.length}권</span> / ${yearGoal}권 (${rate}%)

        </div>
        <div class="flex items-center gap-2">
          <button id="bookSetGoalBtn" class="px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold">목표 변경</button>

          완독 서재 (${books.length})

        <button id="bookTabWishBtn" class="px-3 py-1 rounded-xl text-xs font-bold ${bookSubTab === 'wishlist' ? 'bg-slate-900 text-white' : 'text-slate-600'}">

function setYearlyGoalPrompt() {
  const current = state.bookGoals?.[currentSelectedBookYear] || 12;
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-modal';
  overlay.innerHTML = `
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl border border-slate-200">
      <h3 class="text-xs font-bold text-slate-800 mb-1">${currentSelectedBookYear}년 독서 목표 권수</h3>
      <input id="inAppGoalInput" type="number" min="1" max="999" value="${current}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl my-3 font-bold">
      <div class="flex justify-end gap-2">
        <button id="cancelGoalBtn" class="px-3 py-1.5 text-xs text-slate-500">취소</button>
        <button id="saveGoalBtn" class="px-3.5 py-1.5 bg-slate-900 text-white rounded-xl text-xs font-bold">저장</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelGoalBtn').onclick = () => overlay.remove();
  overlay.querySelector('#saveGoalBtn').onclick = async () => {
    const val = parseInt(overlay.querySelector('#inAppGoalInput').value, 10);
    if (!isNaN(val) && val >= 0) {
      if (!state.bookGoals) state.bookGoals = {};
      state.bookGoals[currentSelectedBookYear] = val;
      await saveAppStateToCloud();
      showToast('목표 권수가 저장되었습니다.');
      renderCurrentView();
    }
    overlay.remove();
  };
}

function convertWishlistToNote(wishId) {
  const item = (state.bookWishlist || []).find(w => w.id === wishId);

    if (a) a.value = item.author || '';
  }, 100);
}

function renderReportDashboard(container) {
  if (!reportPeriod) reportPeriod = todayDate().slice(0, 7);
  const inPeriod = (d) => d && d.startsWith(reportPeriod);

  let totalPeriodInputs = 0;
  const categoryCounts = state.categories.map(cat => {
    const c = (state.notes[cat.id] || []).filter(n => inPeriod(n.date || n.readDate || n.scrapDate || n.updatedAt)).length;
    totalPeriodInputs += c;
    return { cat, count: c };
  });

  const verified = (state.notes.idea || []).filter(i => (i.outcome || '대기중') !== '대기중' && inPeriod(i.reviewDate || i.updatedAt));
  const hits = verified.filter(i => i.outcome === '적중').length;
  const accuracy = verified.length > 0 ? Math.round((hits / verified.length) * 100) : null;

  container.innerHTML = `
    <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-4 shadow-2xs flex items-center justify-between">
      <div class="text-xs font-bold text-slate-800">${reportPeriod} 기간 통계</div>
      <div class="flex items-center gap-2">
        <button id="repPrevBtn" class="w-7 h-7 flex items-center justify-center rounded-lg bg-slate-50 border border-slate-200 font-bold">‹</button>
        <button id="repNextBtn" class="w-7 h-7 flex items-center justify-center rounded-lg bg-slate-50 border border-slate-200 font-bold">›</button>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
      <div class="bg-white border border-slate-200 p-4 rounded-2xl">
        <div class="text-[10px] font-bold text-slate-400 uppercase">기간 총 인풋</div>
        <div class="text-2xl font-black text-slate-800 mt-1">${totalPeriodInputs} <span class="text-xs font-medium text-slate-400">건</span></div>
      </div>
      <div class="bg-white border border-slate-200 p-4 rounded-2xl">
        <div class="text-[10px] font-bold text-slate-400 uppercase">가설 적중률</div>
        <div class="text-2xl font-black ${accuracy !== null && accuracy >= 50 ? 'text-emerald-600' : 'text-slate-700'} mt-1">
          ${accuracy !== null ? accuracy + '%' : '검증 없음'}
        </div>
      </div>
    </div>

    <div class="bg-white border border-slate-200 p-4 rounded-2xl">
      <h4 class="text-xs font-bold text-slate-800 mb-3">서랍별 비중</h4>
      <div class="space-y-2">
        ${categoryCounts.map(({ cat, count }) => {
          const pct = totalPeriodInputs > 0 ? Math.round((count / totalPeriodInputs) * 100) : 0;
          return `
            <div>
              <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm ${cat.dotClass}"></span>${escapeHtml(cat.name)}</span>
                <span>${count}건 (${pct}%)</span>
              </div>
              <div class="w-full h-1.5 rounded-full bg-slate-100 overflow-hidden">
                <div class="h-full rounded-full ${cat.dotClass}" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  container.querySelector('#repPrevBtn').onclick = () => {
    const [y, m] = reportPeriod.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    reportPeriod = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    renderCurrentView();
  };
  container.querySelector('#repNextBtn').onclick = () => {
    const [y, m] = reportPeriod.split('-').map(Number);
    const d = new Date(y, m, 1);
    reportPeriod = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    renderCurrentView();
  };
}

  const reader = new FileReader();
  reader.onload = async (evt) => {

      const parsed = JSON.parse(evt.target.result);
      if (parsed.data) {
        state = parsed.data;

        updateSidebar();
        renderCurrentView();

        showToast('복원 완료!');

  document.querySelectorAll('.input-card').forEach(card => {
    const text = (card.dataset.search || '').toLowerCase();
    card.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
});

window.addEventListener('DOMContentLoaded', () => {
  initFirebase();
});
</script>
</body>
